<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>iii Exhibition 2026 — FV / Scroll Handoff</title>
  <link rel="stylesheet" href="fv-scroll.css">
</head>
<body>
  <header class="top-header">
    <nav aria-label="ページ内ナビゲーション">
      <a href="#concept" aria-label="コンセプト"><img src="assets/top/nav-concept.svg" alt=""></a>
      <a href="#works" aria-label="作品"><img src="assets/top/nav-works.svg" alt=""></a>
      <a href="#announce" aria-label="お知らせ"><img src="assets/top/nav-announce.svg" alt=""></a>
      <a href="#access" aria-label="アクセス"><img src="assets/top/nav-access.svg" alt=""></a>
      <a href="#members" aria-label="メンバー"><img src="assets/top/nav-members.svg" alt=""></a>
      <a href="#archives" aria-label="アーカイブ"><img src="assets/top/nav-archives.svg" alt=""></a>
    </nav>
  </header>

  <main>
    <section class="hero" id="top">
      <h1 class="visually-hidden">東京大学制作展 2026</h1>
      <div class="hero-art" aria-hidden="true">
        <img class="hero-brush" src="assets/concept/iiiex2026-logo.png" alt="">
        <img class="hero-logo" src="assets/concept/iiiex2026-logo.png" alt="">
      </div>
      <div class="hero-composition" aria-hidden="true">
        <img class="hero-title-ja" src="assets/top/title-ja-latest.svg" alt="">
        <img class="hero-venue" src="assets/top/venue-latest.svg" alt="">
        <img class="hero-dates" src="assets/top/dates-latest.svg" alt="">
        <img class="hero-wordmark" src="assets/top/wordmark.svg" alt="">
        <img class="hero-ticket" src="assets/top/reservation-ticket.png" alt="">
      </div>
    </section>

    <!-- Replace the contents of this section with the production CONCEPT section. -->
    <section class="concept-connection" id="concept" aria-label="コンセプト接続位置">
      <div class="concept-connection__copy story-copy">
        <span>01 / CONCEPT</span>
        <p>ここから既存のCONCEPTセクションへ接続します。</p>
      </div>
    </section>
  </main>

  <script src="hero-fragments.js"></script>
  <script src="fv-flow-particles.js"></script>
</body>
</html>
