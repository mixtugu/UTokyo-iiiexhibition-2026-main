<dialog id="detail">
  <button class="close-detail" aria-label="作品詳細を閉じる">CLOSE ×</button>
  <div class="detail-grid">
    <img id="detail-image" alt="" />
    <div>
      <span class="eyebrow" id="detail-number"></span>
      <h2 id="detail-title"></h2>
      <p id="detail-description"></p>
      <p class="draft-note">
        試作のため、作品画像2点で操作を確認できます。<br />正式な作品情報・会場情報は更新予定です。
      </p>
      <button class="text-link" id="next-work">次の作品へ →</button>
    </div>
  </div>
</dialog>
